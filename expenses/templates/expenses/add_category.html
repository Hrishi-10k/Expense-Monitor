{% extends 'expenses/base.html' %}

{% block content %}

<h2>
    <i class="bi bi-folder-plus"></i>
    Add Category
</h2>

<hr>

<div class="card shadow">


<div class="card-body">

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">
                Category Name
            </label>

            <input
                type="text"
                name="name"
                class="form-control"
                placeholder="Enter category name"
                required
            >

        </div>

        <button
            type="submit"
            class="btn btn-success"
        >

            <i class="bi bi-check-circle"></i>
            Save Category

        </button>

        <a
            href="{% url 'view_categories' %}"
            class="btn btn-secondary"
        >

            <i class="bi bi-arrow-left"></i>
            Cancel

        </a>

    </form>

</div>


</div>

{% endblock %}
