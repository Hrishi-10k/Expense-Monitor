{% extends 'expenses/base.html' %}

{% block content %}

<h2>
    <i class="bi bi-pencil-square"></i>
    Edit Budget
</h2>

<hr>

<div class="card shadow">


<div class="card-body">

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">
                Category
            </label>

            <select
                name="category"
                class="form-select"
                required
            >

                {% for category in categories %}

                <option
                    value="{{ category.id }}"

                    {% if category.id == budget.category.id %}
                        selected
                    {% endif %}
                >

                    {{ category.name }}

                </option>

                {% endfor %}

            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Monthly Budget
            </label>

            <input
                type="number"
                name="monthly_limit"
                class="form-control"
                value="{{ budget.monthly_limit }}"
                min="0.01"
                step="0.01"
                required
            >

        </div>

        <button
            type="submit"
            class="btn btn-warning"
        >

            <i class="bi bi-check-circle"></i>
            Update Budget

        </button>

        <a
            href="{% url 'view_budgets' %}"
            class="btn btn-secondary"
        >

            <i class="bi bi-arrow-left"></i>
            Cancel

        </a>

    </form>

</div>


</div>

{% endblock %}
